# 04  Align the content of UAT-ALIGN with production (step F). CHANGES UAT-ALIGN ONLY. Each stage needs approval on the environment uat-align-write.
# Stages that are scripted today (run in this order; every one has a dry run that lists what it would change, and the default is a DRY RUN):
#   F1  Re-import verified unmanaged sources (Part 2 of the import order)        -> Import-Solutions.ps1 -Part 2
#   F9  Option set values: add the values that exist only in production          -> Set-OptionSetValues.ps1
#   F2  Web resources: only the names approved in pipelines/config/approved-web-resources.json -> Update-WebResources.ps1
#   F6  Business rule and classic workflow states (cloud flows are skipped)      -> Set-FlowStates.ps1
# NOT scripted yet (do them by hand or add scripts): F3 plugin assemblies and steps, F4 forms, F5 views, F7 column properties, F8 tables, F10 apps and site maps,
# F11 other component types, F12 connection references and environment variables. See pipelines/README.md.
name: align-content-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: dryRun
  displayName: Dry run (list what would change, change nothing)
  type: boolean
  default: true
- name: runF1
  displayName: F1 re-import verified sources
  type: boolean
  default: false
- name: runF9
  displayName: F9 option set values
  type: boolean
  default: false
- name: runF2
  displayName: F2 web resources
  type: boolean
  default: false
- name: runF6
  displayName: F6 workflow states
  type: boolean
  default: false
- name: collectRunId
  displayName: Run id of pipeline 02 (sources and prod-components artifacts)
  type: number
  default: 0
- name: collectPipelineId
  displayName: Pipeline id of 02-collect-sources
  type: number
  default: 0
- name: backupTaken
  displayName: I took the backup UAT-ALIGN-before-F
  type: boolean
  default: false

pool:
  vmImage: windows-latest

variables:
- group: uat-align-secrets

stages:
- stage: Checks
  displayName: Before changing anything
  jobs:
  - job: checks
    steps:
    - checkout: none
    - script: |
        if "${{ parameters.backupTaken }}"=="False" if "${{ parameters.dryRun }}"=="False" (echo ##vso[task.logissue type=error]Take the backup UAT-ALIGN-before-F first & exit /b 1)
        if "${{ parameters.collectRunId }}"=="0" (echo ##vso[task.logissue type=error]Give the run id of pipeline 02 & exit /b 1)
      displayName: Backup and inputs

- ${{ if eq(parameters.runF1, true) }}:
  - stage: F1
    displayName: F1 re-import verified sources
    dependsOn: Checks
    jobs:
    - deployment: f1
      environment: uat-align-write
      timeoutInMinutes: 480
      strategy:
        runOnce:
          deploy:
            steps:
            - template: ../templates/setup.yml
            - task: DownloadPipelineArtifact@2
              inputs:
                buildType: specific
                project: $(System.TeamProjectId)
                definition: ${{ parameters.collectPipelineId }}
                buildVersionToDownload: specific
                pipelineId: ${{ parameters.collectRunId }}
                artifactName: sources
                targetPath: $(Pipeline.Workspace)\sources
            - template: ../templates/pwsh.yml
              parameters:
                displayName: Import Part 2
                script: |
                  $d = if ('${{ parameters.dryRun }}' -eq 'True') { '-DryRun' } else { '' }
                  & pwsh -NoProfile -File .\tools\scripts\pipeline\Import-Solutions.ps1 -Part 2 -ZipRoot "$(Pipeline.Workspace)\sources" -ResultFile "$(Build.ArtifactStagingDirectory)\f1-results.csv" $d
                  exit $LASTEXITCODE

- ${{ if eq(parameters.runF9, true) }}:
  - stage: F9
    displayName: F9 option set values
    dependsOn: Checks
    jobs:
    - deployment: f9
      environment: uat-align-write
      strategy:
        runOnce:
          deploy:
            steps:
            - template: ../templates/setup.yml
            - template: ../templates/pwsh.yml
              parameters:
                displayName: Add the missing option set values
                script: |
                  $d = if ('${{ parameters.dryRun }}' -eq 'True') { '-DryRun' } else { '' }
                  & pwsh -NoProfile -File .\tools\scripts\pipeline\Set-OptionSetValues.ps1 -ReportFile "$(Build.ArtifactStagingDirectory)\f9-report.csv" $d
                  exit $LASTEXITCODE
            - task: PublishPipelineArtifact@1
              condition: always()
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)\f9-report.csv
                artifact: f9-report

- ${{ if eq(parameters.runF2, true) }}:
  - stage: F2
    displayName: F2 web resources
    dependsOn: Checks
    jobs:
    - deployment: f2
      environment: uat-align-write
      strategy:
        runOnce:
          deploy:
            steps:
            - template: ../templates/setup.yml
            - task: DownloadPipelineArtifact@2
              inputs:
                buildType: specific
                project: $(System.TeamProjectId)
                definition: ${{ parameters.collectPipelineId }}
                buildVersionToDownload: specific
                pipelineId: ${{ parameters.collectRunId }}
                artifactName: prod-components
                targetPath: $(Pipeline.Workspace)\prod-components
            - template: ../templates/pwsh.yml
              parameters:
                displayName: Update the approved web resources
                script: |
                  $d = if ('${{ parameters.dryRun }}' -eq 'True') { '-DryRun' } else { '' }
                  & pwsh -NoProfile -File .\tools\scripts\pipeline\Update-WebResources.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f2-report.csv" $d
                  exit $LASTEXITCODE
            - task: PublishPipelineArtifact@1
              condition: always()
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)\f2-report.csv
                artifact: f2-report

- ${{ if eq(parameters.runF6, true) }}:
  - stage: F6
    displayName: F6 workflow states
    dependsOn: Checks
    jobs:
    - deployment: f6
      environment: uat-align-write
      strategy:
        runOnce:
          deploy:
            steps:
            - template: ../templates/setup.yml
            - template: ../templates/pwsh.yml
              parameters:
                displayName: Set business rule and workflow states to the production state
                script: |
                  $d = if ('${{ parameters.dryRun }}' -eq 'True') { '-DryRun' } else { '' }
                  & pwsh -NoProfile -File .\tools\scripts\pipeline\Set-FlowStates.ps1 -ReportFile "$(Build.ArtifactStagingDirectory)\f6-report.csv" $d
                  exit $LASTEXITCODE
            - task: PublishPipelineArtifact@1
              condition: always()
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)\f6-report.csv
                artifact: f6-report
