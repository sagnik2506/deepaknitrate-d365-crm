# 04  Align the content of UAT-ALIGN with production (step F). CHANGES UAT-ALIGN ONLY. Every stage needs approval on the Azure DevOps Environment uat-align-write.
# The stages run one after the other in this order (dependencies first); switch on the ones you want. The default is a DRY RUN: each script lists what it would change.
#   F1  Re-import verified unmanaged sources (Part 2 of the import order)              Import-Solutions.ps1 -Part 2
#   F9  Option set values: add the values that exist only in production                 Set-OptionSetValues.ps1
#   F7  Column properties (max length, precision, required) for approved columns        Set-ColumnProperties.ps1
#   F2  Web resources named in approved-web-resources.json                              Update-WebResources.ps1
#   F3a Plugin assemblies named in approved-plugin-assemblies.json (update the DLL)     Update-PluginAssemblies.ps1
#   F3b Plugin steps that exist only in production, ids in approved-plugin-steps.json   Register-PluginSteps.ps1
#   F4  Forms with ids in approved-forms.json (role ids are translated by role name)    Update-Forms.ps1
#   F5  Views with ids in approved-views.json (table object type code kept)             Update-Views.ps1
#   F6  Business rule and classic workflow states (cloud flows are skipped)             Set-FlowStates.ps1
# Nothing changes unless a name or id is in the matching approved-*.json file in pipelines/config (set after the triage, step C2). Roles must be aligned before F4 (step H2).
# Still by hand: F8 tables (they arrive with imports), F10 apps and site maps, F11 other component types, F12 connection references and environment variables.
name: align-content-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: dryRun
  displayName: Dry run (list what would change, change nothing)
  type: boolean
  default: true
- name: runF1
  displayName: F1 re-import verified sources
  type: boolean
  default: false
- name: runF9
  displayName: F9 option set values
  type: boolean
  default: false
- name: runF7
  displayName: F7 column properties
  type: boolean
  default: false
- name: runF2
  displayName: F2 web resources
  type: boolean
  default: false
- name: runF3a
  displayName: F3a plugin assemblies
  type: boolean
  default: false
- name: runF3b
  displayName: F3b plugin steps
  type: boolean
  default: false
- name: runF4
  displayName: F4 forms
  type: boolean
  default: false
- name: runF5
  displayName: F5 views
  type: boolean
  default: false
- name: runF6
  displayName: F6 workflow states
  type: boolean
  default: false
- name: collectRunId
  displayName: Run id of pipeline 02 (artifacts sources and prod-components)
  type: number
  default: 0
- name: collectPipelineId
  displayName: Pipeline id of 02-collect-sources
  type: number
  default: 0
- name: backupTaken
  displayName: I took the backup UAT-ALIGN-before-F
  type: boolean
  default: false

pool:
  vmImage: windows-latest

variables:
- group: uat-align-secrets

stages:
- stage: Checks
  displayName: Before changing anything
  jobs:
  - job: checks
    steps:
    - checkout: none
    - script: |
        if "${{ parameters.backupTaken }}"=="False" if "${{ parameters.dryRun }}"=="False" (echo ##vso[task.logissue type=error]Take the backup UAT-ALIGN-before-F first & exit /b 1)
        if "${{ parameters.collectRunId }}"=="0" (echo ##vso[task.logissue type=error]Give the run id of pipeline 02 & exit /b 1)
      displayName: Backup and inputs

- template: ../templates/align-stage.yml
  parameters:
    name: F1
    displayName: F1 re-import verified sources
    dependsOn: Checks
    enabled: ${{ parameters.runF1 }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: sources
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    timeout: 480
    report: f1-results.csv
    command: Import-Solutions.ps1 -Part 2 -ZipRoot "$(Pipeline.Workspace)\sources" -ResultFile "$(Build.ArtifactStagingDirectory)\f1-results.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F9
    displayName: F9 option set values
    dependsOn: F1
    enabled: ${{ parameters.runF9 }}
    dryRun: ${{ parameters.dryRun }}
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f9-report.csv
    command: Set-OptionSetValues.ps1 -ReportFile "$(Build.ArtifactStagingDirectory)\f9-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F7
    displayName: F7 column properties
    dependsOn: F9
    enabled: ${{ parameters.runF7 }}
    dryRun: ${{ parameters.dryRun }}
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f7-report.csv
    command: Set-ColumnProperties.ps1 -ReportFile "$(Build.ArtifactStagingDirectory)\f7-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F2
    displayName: F2 web resources
    dependsOn: F7
    enabled: ${{ parameters.runF2 }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: prod-components
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f2-report.csv
    command: Update-WebResources.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f2-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F3a
    displayName: F3a plugin assemblies
    dependsOn: F2
    enabled: ${{ parameters.runF3a }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: prod-components
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f3a-report.csv
    command: Update-PluginAssemblies.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f3a-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F3b
    displayName: F3b plugin steps
    dependsOn: F3a
    enabled: ${{ parameters.runF3b }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: prod-components
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f3b-report.csv
    command: Register-PluginSteps.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f3b-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F4
    displayName: F4 forms
    dependsOn: F3b
    enabled: ${{ parameters.runF4 }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: prod-components
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f4-report.csv
    command: Update-Forms.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f4-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F5
    displayName: F5 views
    dependsOn: F4
    enabled: ${{ parameters.runF5 }}
    dryRun: ${{ parameters.dryRun }}
    downloadArtifact: prod-components
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f5-report.csv
    command: Update-Views.ps1 -SourceDir "$(Pipeline.Workspace)\prod-components" -ReportFile "$(Build.ArtifactStagingDirectory)\f5-report.csv"

- template: ../templates/align-stage.yml
  parameters:
    name: F6
    displayName: F6 workflow states
    dependsOn: F5
    enabled: ${{ parameters.runF6 }}
    dryRun: ${{ parameters.dryRun }}
    collectPipelineId: ${{ parameters.collectPipelineId }}
    collectRunId: ${{ parameters.collectRunId }}
    report: f6-report.csv
    command: Set-FlowStates.ps1 -ReportFile "$(Build.ArtifactStagingDirectory)\f6-report.csv"
